<!DOCTYPE html>
<html>
<head>
    <title>Student Result Processing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Result</h1>

    <form action="studentResult" method="post">

        <label for="name">Student Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter student name">

        <label for="regNo">Register Number</label>
        <input type="text" id="regNo" name="regNo"
               placeholder="Enter register number">

        <label for="mark1">Subject 1 Mark</label>
        <input type="number" id="mark1" name="mark1"
               placeholder="Enter mark" min="0" max="100">

        <label for="mark2">Subject 2 Mark</label>
        <input type="number" id="mark2" name="mark2"
               placeholder="Enter mark" min="0" max="100">

        <label for="mark3">Subject 3 Mark</label>
        <input type="number" id="mark3" name="mark3"
               placeholder="Enter mark" min="0" max="100">

        <button type="submit">
            Calculate Result
        </button>

    </form>

</div>

</body>
</html>
